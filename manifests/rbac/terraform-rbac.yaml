apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: terraform-operator
rules:
- apiGroups: ["", "apps", "networking.k8s.io", "cert-manager.io"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: terraform-operator-binding
subjects:
- kind: ServiceAccount
  name: terraform
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: terraform-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: terraform-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: terraform
type: kubernetes.io/service-account-token
