apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    tunnel: 8a9756d3-2bd5-4ef0-b71d-1f4113e3f63b
    credentials-file: /etc/cloudflared/creds/credentials.json
    ingress:
      - hostname: app.jhermesn.dev
        service: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloudflared}
  template:
    metadata:
      labels: {app: cloudflared}
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run"]
        volumeMounts:
        - {name: config, mountPath: /etc/cloudflared}
        - {name: creds, mountPath: /etc/cloudflared/creds}
      volumes:
      - name: config
        configMap: {name: cloudflared-config}
      - name: creds
        secret: {secretName: cloudflared-creds}
